<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - إدارة وتتبع السائقين</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-white font-sans flex flex-col h-screen overflow-hidden">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-emerald-400">نظام إدارة وتتبع السائقين الحي</h1>
    <span class="bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full border border-emerald-500/30">متصل بالخادم</span>
  </header>

  <!-- Main Layout -->
  <div class="flex flex-1 overflow-hidden">
    
    <!-- Left/Sidebar Panel: Driver Management -->
    <div class="w-1/3 bg-slate-800/50 border-l border-slate-700 p-4 flex flex-col gap-4 overflow-y-auto">
      
      <!-- Add Driver Form -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <h2 class="text-md font-semibold text-slate-200 mb-3">إضافة سائق جديد</h2>
        <form id="addDriverForm" class="space-y-3">
          <input type="text" id="driverName" placeholder="اسم السائق" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-emerald-500" required />
          <div class="flex gap-2">
            <input type="text" id="loginCode" placeholder="كود الدخول (4 أرقام)" class="w-1/2 bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-emerald-500" required />
            <input type="text" id="phone" placeholder="رقم الهاتف" class="w-1/2 bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-emerald-500" required />
          </div>
          <input type="text" id="vehicle" placeholder="رقم/نوع المركبة" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-emerald-500" required />
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded text-sm transition">حفظ السائق</button>
        </form>
      </div>

      <!-- Driver List -->
      <div class="flex-1">
        <h2 class="text-md font-semibold text-slate-200 mb-3">قائمة السائقين</h2>
        <div id="driversList" class="space-y-2">
          <!-- Dynamic Drivers Loaded Here -->
        </div>
      </div>

    </div>

    <!-- Right Panel: Live Map -->
    <div class="w-2/3 h-full relative">
      <div id="map" class="w-full h-full"></div>
    </div>

  </div>

  <script>
    // 1. Firebase Config Setup
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "SENDER_ID",
      appId: "APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. Map Initialization (Default to Cairo)
    const map = L.map('map').setView([30.0444, 31.2357], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const markers = {};

    // 3. Add Driver Handler
    document.getElementById('addDriverForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const driverId = 'DRIVER_' + Date.now().toString().slice(-4);
      const name = document.getElementById('driverName').value;
      const loginCode = document.getElementById('loginCode').value;
      const phone = document.getElementById('phone').value;
      const vehicle = document.getElementById('vehicle').value;

      db.ref('drivers/' + driverId).set({
        driverId, name, loginCode, phone, vehicle, status: 'active'
      }).then(() => {
        document.getElementById('addDriverForm').reset();
      });
    });

    // 4. Listen to Drivers List & Live Tracking
    db.ref('drivers').on('value', (snapshot) => {
      const drivers = snapshot.val() || {};
      const listContainer = document.getElementById('driversList');
      listContainer.innerHTML = '';

      Object.keys(drivers).forEach((id) => {
        const d = drivers[id];
        
        // Render List Card
        const card = document.createElement('div');
        card.className = "bg-slate-800 p-3 rounded-lg border border-slate-700 flex justify-between items-center cursor-pointer hover:border-slate-500 transition";
        card.innerHTML = `
          <div>
            <div class="font-bold text-emerald-400">${d.name}</div>
            <div class="text-xs text-slate-400">كود الدخول: <span class="text-white font-mono bg-slate-900 px-1 rounded">${d.loginCode}</span> | المركبة: ${d.vehicle}</div>
            <div class="text-xs text-slate-400">الهاتف: ${d.phone}</div>
          </div>
          <button onclick="focusDriver('${id}')" class="bg-slate-700 hover:bg-slate-600 text-xs px-2 py-1 rounded">تتبع</button>
        `;
        listContainer.appendChild(card);

        // Listen for live location per driver
        listenToLocation(id, d.name);
      });
    });

    function listenToLocation(driverId, driverName) {
      db.ref('live_tracking/' + driverId).on('value', (snapshot) => {
        const loc = snapshot.val();
        if (loc && loc.latitude && loc.longitude) {
          const latLng = [loc.latitude, loc.longitude];

          if (markers[driverId]) {
            markers[driverId].setLatLng(latLng);
          } else {
            markers[driverId] = L.marker(latLng).addTo(map)
              .bindPopup(`<b>${driverName}</b><br>السرعة: ${loc.speed || 0} كم/س`);
          }
        }
      });
    }

    function focusDriver(driverId) {
      if (markers[driverId]) {
        map.flyTo(markers[driverId].getLatLng(), 16);
        markers[driverId].openPopup();
      }
    }
  </script>
</body>
</html>

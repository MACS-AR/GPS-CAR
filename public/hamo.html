<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم المتقدمة - إدارة وتتبع المركبات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-white font-sans flex flex-col h-screen overflow-hidden">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-3">
      <h1 class="text-xl font-bold text-emerald-400">لوحة تتبع المركبات والسائقين (المتقدمة)</h1>
      <span class="bg-slate-700 text-xs px-2 py-1 rounded text-slate-300">مسار النظام: /vehicleDrivers</span>
    </div>
    <div class="flex items-center gap-4">
      <div id="activeAlertsCount" class="bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs px-3 py-1 rounded-full hidden">
        تنبيهات نشطة: <span id="alertCountNum">0</span>
      </div>
      <span class="bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full border border-emerald-500/30 flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> متصل مباشر
      </span>
    </div>
  </header>

  <!-- Main Content Layout -->
  <div class="flex flex-1 overflow-hidden">
    
    <!-- Sidebar / Driver Management & Alerts Panel -->
    <div class="w-96 bg-slate-800/50 border-l border-slate-700 p-4 flex flex-col gap-4 overflow-y-auto">
      
      <!-- Add New Driver Form -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
        <h2 class="text-sm font-bold text-slate-200 mb-3 border-b border-slate-700 pb-2">إضافة كود دخول سائق جديد</h2>
        <form id="addDriverForm" class="space-y-3">
          <div>
            <label class="text-xs text-slate-400">كود الدخول (Key):</label>
            <input type="text" id="code" placeholder="مثال: 1001" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-emerald-500" required />
          </div>
          <div>
            <label class="text-xs text-slate-400">اسم السائق (displayName):</label>
            <input type="text" id="displayName" placeholder="اسم السائق الثلاثي" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-emerald-500" required />
          </div>
          <div>
            <label class="text-xs text-slate-400">رقم الهاتف (phone):</label>
            <input type="text" id="phone" placeholder="01xxxxxxxxx" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-emerald-500" required />
          </div>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded text-sm transition shadow">تسجيل السائق في Firebase</button>
        </form>
      </div>

      <!-- Live Alerts Box -->
      <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 shadow">
        <h2 class="text-sm font-bold text-rose-400 mb-2 border-b border-slate-700 pb-1 flex justify-between items-center">
          <span>التنبيهات الفورية</span>
          <span class="text-[10px] text-slate-400">سرعة > 100 | بطارية < 20%</span>
        </h2>
        <div id="alertsList" class="space-y-2 max-h-36 overflow-y-auto text-xs">
          <div class="text-slate-400 text-center py-2">لا توجد تنبيهات نشطة حالياً</div>
        </div>
      </div>

      <!-- Drivers List -->
      <div class="flex-1">
        <h2 class="text-sm font-bold text-slate-200 mb-3 border-b border-slate-700 pb-2">قائمة السائقين والمركبات</h2>
        <div id="driversList" class="space-y-2">
          <!-- Live list generated via JS -->
        </div>
      </div>

    </div>

    <!-- Map View -->
    <div class="flex-1 relative">
      <div id="map" class="w-full h-full"></div>
    </div>

  </div>

  <script>
    // 1. Firebase Configurations
    const firebaseConfig = {
      apiKey: "AIzaSyBgRkceRq7FRbhCevLlULYNy-A5Tl_cr0w",
      authDomain: "sr-test-c9e06.firebaseapp.com",
      databaseURL: "https://sr-test-c9e06-default-rtdb.firebaseio.com",
      projectId: "sr-test-c9e06",
      storageBucket: "sr-test-c9e06.firebasestorage.app",
      messagingSenderId: "658396508062",
      appId: "1:658396508062:web:c56cd84f93daa2e176308f",
      measurementId: "G-3ZZV344NDK"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const driversRef = db.ref("vehicleDrivers");

    // 2. Leaflet Map Setup
    const map = L.map('map').setView([30.0444, 31.2357], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const markers = {};
    const driverPaths = {}; // تخزين إحداثيات مسار الحركة لكل سائق لرسم الـ Polyline
    const pathLines = {};   // طبقات الخطوط المرسومة على الخريطة

    // 3. Add Driver (Create Node in Firebase)
    document.getElementById('addDriverForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const code = document.getElementById('code').value.trim();
      const displayName = document.getElementById('displayName').value.trim();
      const phone = document.getElementById('phone').value.trim();

      driversRef.child(code).set({
        displayName: displayName,
        phone: phone,
        vehicleDriverId: "DRV_" + code,
        tenantId: "default",
        subscriptionValid: true,
        deviceId: "",
        lastLogin: 0
      }).then(() => {
        alert('تم حفظ السائق بنجاح. يمكنه الآن تسجيل الدخول بالكود: ' + code);
        document.getElementById('addDriverForm').reset();
      }).catch((err) => {
        alert('خطأ في الحفظ: ' + err.message);
      });
    });

    // 4. Realtime Listener for All Vehicle Drivers & Motion/Alert Processing
    driversRef.on('value', (snapshot) => {
      const driversData = snapshot.val() || {};
      const listContainer = document.getElementById('driversList');
      const alertsContainer = document.getElementById('alertsList');
      
      listContainer.innerHTML = '';
      alertsContainer.innerHTML = '';
      let activeAlertsCount = 0;

      Object.keys(driversData).forEach((code) => {
        const d = driversData[code];
        const liveLoc = d.liveLocation || {};
        const health = d.deviceHealth || {};

        const hasLocation = liveLoc.latitude && liveLoc.longitude;
        const speed = liveLoc.speed ? Math.round(liveLoc.speed) : 0;
        const battery = liveLoc.battery || health.battery || 100;
        const isOnline = (Date.now() - (liveLoc.timestamp || 0)) < 60000; // Active within 60s

        // التحقق من التنبيهات (تجاوز السرعة أو انخفاض البطارية)
        let alertMessages = [];
        if (speed > 100) {
          alertMessages.push(`تجاوز السرعة (${speed} كم/س)`);
          activeAlertsCount++;
        }
        if (battery !== '--' && Number(battery) < 20) {
          alertMessages.push(`بطارية منخفضة (${battery}%)`);
          activeAlertsCount++;
        }

        // إذا وُجدت تنبيهات لهذا السائق، قم بعرضها في اللوحة الجانبية
        if (alertMessages.length > 0 && isOnline) {
          const alertItem = document.createElement('div');
          alertItem.className = "bg-rose-500/10 border border-rose-500/30 p-2 rounded flex flex-col gap-1 text-rose-300";
          alertItem.innerHTML = `
            <div class="font-bold flex justify-between">
              <span>${d.displayName || code}</span>
              <span class="text-[10px] bg-rose-500 text-white px-1 rounded">تنبيه</span>
            </div>
            <div>${alertMessages.join(' - ')}</div>
          `;
          alertsContainer.appendChild(alertItem);
        }

        // Create List Card UI
        const card = document.createElement('div');
        card.className = `bg-slate-800 p-3 rounded-lg border ${alertMessages.length > 0 ? 'border-rose-500/50' : 'border-slate-700'} flex flex-col gap-2 hover:border-slate-500 transition`;
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <div class="font-bold text-emerald-400 text-sm flex items-center gap-2">
                ${d.displayName || 'سائق'}
                ${alertMessages.length > 0 ? '<span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>' : ''}
              </div>
              <div class="text-xs text-slate-400">الكود: <span class="text-white font-mono bg-slate-900 px-1 rounded">${code}</span></div>
            </div>
            <span class="text-[10px] px-2 py-0.5 rounded ${isOnline ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-slate-700 text-slate-400'}">
              ${isOnline ? 'مباشر الان' : 'غير متصل'}
            </span>
          </div>

          <div class="text-xs text-slate-300 grid grid-cols-2 gap-1 bg-slate-900/50 p-2 rounded border border-slate-700/50">
            <div>الهاتف: ${d.phone || 'غير مسجل'}</div>
            <div>السرعة: <span class="${speed > 100 ? 'text-rose-400 font-bold' : ''}">${speed} كم/س</span></div>
            <div>البطارية: <span class="${battery < 20 ? 'text-rose-400 font-bold' : ''}">%${battery}</span></div>
            <div>الجهاز: ${d.deviceId ? 'مرتبط' : 'غير مرتبط'}</div>
          </div>

          ${hasLocation ? `
            <div class="flex gap-1">
              <button onclick="focusMap('${code}', ${liveLoc.latitude}, ${liveLoc.longitude})" class="flex-1 bg-slate-700 hover:bg-slate-600 text-xs py-1 rounded text-slate-200 transition">
                تحديد الموقع
              </button>
              <button onclick="clearPath('${code}')" class="bg-slate-700 hover:bg-rose-600/50 text-xs px-2 py-1 rounded text-slate-300 transition" title="مسح مسار الحركة">
                مسح المسار
              </button>
            </div>
          ` : '<div class="text-[11px] text-amber-500/80 text-center">في انتظار إرسال الموقع الأول...</div>'}
        `;
        listContainer.appendChild(card);

        // Update Map Marker & Path Polylines (تتبع الحركة الفعلي ورسم الخطوط)
        if (hasLocation) {
          const latLng = [liveLoc.latitude, liveLoc.longitude];
          
          // حفظ نقاط المسار للرسم
          if (!driverPaths[code]) {
            driverPaths[code] = [];
          }
          // إضافة النقطة إذا كانت مختلفة عن النقطة الأخيرة لمنع التكرار المفرط
          const lastPoint = driverPaths[code][driverPaths[code].length - 1];
          if (!lastPoint || lastPoint[0] !== latLng[0] || lastPoint[1] !== latLng[1]) {
            driverPaths[code].push(latLng);
            // الاحتفاظ بآخر 50 نقطة مسار فقط لتجنب ضغط الذاكرة
            if (driverPaths[code].length > 50) driverPaths[code].shift();
          }

          const popupContent = `
            <div style="direction: rtl; text-align: right; font-family: sans-serif;">
              <b>${d.displayName || code}</b><br>
              السرعة: <span style="color:${speed > 100 ? 'red':'green'}">${speed} كم/س</span><br>
              شحن البطارية: %${battery}<br>
              ${alertMessages.length > 0 ? `<b style="color:red;">تحذير: ${alertMessages.join(', ')}</b>` : ''}
            </div>
          `;

          if (markers[code]) {
            markers[code].setLatLng(latLng);
            markers[code].getPopup().setContent(popupContent);
          } else {
            markers[code] = L.marker(latLng).addTo(map).bindPopup(popupContent);
          }

          // رسم أو تحديث مسار الحركة (Polyline)
          if (pathLines[code]) {
            pathLines[code].setLatLngs(driverPaths[code]);
          } else {
            pathLines[code] = L.polyline(driverPaths[code], { color: '#10b981', weight: 4, opacity: 0.7 }).addTo(map);
          }
        }
      });

      // تحديث مؤشر عداد التنبيهات في الهيدر
      const alertBadge = document.getElementById('activeAlertsCount');
      const alertNum = document.getElementById('alertCountNum');
      if (activeAlertsCount > 0) {
        alertBadge.classList.remove('hidden');
        alertNum.innerText = activeAlertsCount;
        if (alertsContainer.children.length === 0) {
          alertsContainer.innerHTML = '<div class="text-slate-400 text-center py-2">لا توجد تنبيهات نشطة حالياً</div>';
        }
      } else {
        alertBadge.classList.add('hidden');
        alertsContainer.innerHTML = '<div class="text-slate-400 text-center py-2">لا توجد تنبيهات نشطة حالياً</div>';
      }
    });

    // Map Focus Helper
    function focusMap(code, lat, lng) {
      map.flyTo([lat, lng], 16);
      if (markers[code]) {
        markers[code].openPopup();
      }
    }

    // مسح مسار الحركة لسائق معين
    function clearPath(code) {
      driverPaths[code] = [];
      if (pathLines[code]) {
        map.removeLayer(pathLines[code]);
        delete pathLines[code];
      }
      alert('تم مسح مسار الحركة للسائق: ' + code);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم تتبع السيارات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Firebase SDK (v8 CDN) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        #map { height: calc(100vh - 80px); }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <span>📍</span> لوحة تتبع الأسطول اللحظية
        </h1>
        <button onclick="toggleModal(true)" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium shadow transition">
            + إضافة سائق جديد
        </button>
    </header>

    <!-- Main Container -->
    <div class="flex flex-col md:flex-row h-[calc(100vh-68px)]">
        
        <!-- Sidebar / Driver List -->
        <div class="w-full md:w-96 bg-white border-l border-gray-200 overflow-y-auto p-4 shadow-inner">
            <h2 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">قائمة السائقين</h2>
            <div id="driversList" class="space-y-3">
                <p class="text-gray-500 text-center py-4">جاري تحميل البيانات...</p>
            </div>
        </div>

        <!-- Map Container -->
        <div class="flex-1 relative">
            <div id="map" class="w-full h-full"></div>
        </div>
    </div>

    <!-- Modal: Add Driver -->
    <div id="addModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-[1000]">
        <div class="bg-white p-6 rounded-xl w-full max-w-md shadow-2xl relative">
            <h3 class="text-xl font-bold mb-4 text-gray-800">إضافة مركبة / سائق جديد</h3>
            <form id="addDriverForm" onsubmit="saveDriver(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">كود التتبع (كود السيارة)</label>
                    <input type="text" id="code" required class="w-full mt-1 p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none" placeholder="مثال: CAR-101">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">اسم السائق</label>
                    <input type="text" id="name" required class="w-full mt-1 p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none" placeholder="مثال: أحمد محمود">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">رقم الهاتف</label>
                    <input type="tel" id="phone" required class="w-full mt-1 p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none" placeholder="مثال: 01000000000">
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="toggleModal(false)" class="px-4 py-2 border rounded-md text-gray-600 hover:bg-gray-50">إلغاء</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">حفظ وتوليد الكود</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. إعدادات Firebase (ضع إعدادات مشروعك هنا)
        const firebaseConfig = {
            databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref("vehicleDrivers");

        // 2. إعداد الخريطة (افتراضياً على مصر)
        const map = L.map('map').setView([30.0444, 31.2357], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const markers = {};

        // 3. الاستماع للتغييرات اللحظية من Firebase
        db.on('value', (snapshot) => {
            const drivers = snapshot.val() || {};
            renderDriversList(drivers);
            updateMapMarkers(drivers);
        });

        // 4. عرض قائمة السائقين
        function renderDriversList(drivers) {
            const container = document.getElementById('driversList');
            container.innerHTML = '';

            const keys = Object.keys(drivers);
            if (keys.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-4">لا يوجد سائقين مسجلين</p>';
                return;
            }

            keys.forEach(code => {
                const item = drivers[code];
                const loc = item.liveLocation || {};
                const health = item.deviceHealth || {};
                const isOnline = loc.time && (Date.now() - loc.time < 30000); // يعتبر متصل إذا حدث موقع خلال 30 ثانية

                const card = document.createElement('div');
                card.className = `p-4 border rounded-lg transition cursor-pointer hover:shadow-md ${isOnline ? 'border-green-300 bg-green-50/30' : 'border-gray-200 bg-gray-50'}`;
                card.onclick = () => focusOnMap(loc.lat, loc.lng);

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-gray-900">${item.name || 'سائق غير معرف'}</h3>
                            <p class="text-xs text-gray-500">الكود: <span class="font-mono bg-gray-200 px-1 rounded">${code}</span></p>
                        </div>
                        <span class="w-3 h-3 rounded-full ${isOnline ? 'bg-green-500 animate-pulse' : 'bg-gray-400'}"></span>
                    </div>
                    
                    <div class="mt-3 grid grid-cols-2 gap-2 text-xs text-gray-600">
                        <div>السرعة: <span class="font-bold text-gray-800">${Math.round(loc.speed || 0)} كم/س</span></div>
                        <div>البطارية: <span class="font-bold text-gray-800">${health.batteryLevel ?? '--'}%</span></div>
                        <div class="col-span-2">الهاتف: ${item.phone || '--'}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 5. تحديث العلامات على الخريطة
        function updateMapMarkers(drivers) {
            Object.keys(drivers).forEach(code => {
                const item = drivers[code];
                const loc = item.liveLocation;

                if (loc && loc.lat && loc.lng) {
                    if (markers[code]) {
                        // تحديث موقع العلامة الحالية
                        markers[code].setLatLng([loc.lat, loc.lng]);
                    } else {
                        // إنشاء علامة جديدة
                        const marker = L.marker([loc.lat, loc.lng]).addTo(map)
                            .bindPopup(`<b>${item.name}</b><br>كود: ${code}<br>السرعة: ${Math.round(loc.speed || 0)} كم/س`);
                        markers[code] = marker;
                    }
                }
            });
        }

        // 6. التركيز على سائق معين عند الضغط عليه
        function focusOnMap(lat, lng) {
            if (lat && lng) {
                map.setView([lat, lng], 16, { animate: true });
            }
        }

        // 7. إضافة سائق جديد لقاعدة البيانات
        function saveDriver(e) {
            e.preventDefault();
            const code = document.getElementById('code').value.trim();
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();

            if (!code) return;

            db.child(code).set({
                name: name,
                phone: phone,
                createdAt: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                toggleModal(false);
                document.getElementById('addDriverForm').reset();
            }).catch(err => alert("حدث خطأ: " + err.message));
        }

        function toggleModal(show) {
            document.getElementById('addModal').classList.toggle('hidden', !show);
        }
    </script>
</body>
</html>
